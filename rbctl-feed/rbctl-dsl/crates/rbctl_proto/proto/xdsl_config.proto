// xDSL configuration + ATM/PTM link management.
//
// Replaces OEM opcodes 1 (DSL config), 5/6 (ATM link add/del),
// 15/16 (PTM link add/del), 3 (retrain).

syntax = "proto3";

package rbctl;

import "common.proto";

message ConfigRequest {
  oneof action {
    LineConfig    line_config  = 1;
    AtmLinkConfig atm_link_add = 2;
    AtmLinkOp     atm_link_del = 3;
    PtmLinkConfig ptm_link_add = 4;
    PtmLinkOp     ptm_link_del = 5;
    LineOp        line_retrain = 6;
    LineOp        line_reset   = 7;
  }
}

message LineConfig {
  ModulationType modulation           = 1;
  AnnexType      annex                = 2;
  bool           bitswap              = 3;
  bool           sra                  = 4;
  uint32         vdsl2_profile        = 5;
  int32          snrm_offset_db_tenths = 6;
  uint32         max_ds_rate_kbps     = 10;
  uint32         max_us_rate_kbps     = 11;
  uint32         vectoring_mode       = 20;
}

message AtmLinkConfig {
  uint32 vpi       = 1;
  uint32 vci       = 2;
  uint32 encap     = 3;  // 0=LLC, 1=VCMUX
  uint32 link_type = 4;  // 0=EoA, 6=PPPoA, 7=IPoA
  uint32 qos       = 5;  // 0=UBR, 1=CBR, 2=VBR
  uint32 pcr       = 6;
  uint32 scr       = 7;
  uint32 mbs       = 8;
  uint32 vlan_id   = 9;  // 2000-2007
}

message PtmLinkConfig {
  bool   tag_enable = 1;
  uint32 tag_vid    = 2;
  uint32 tag_pri    = 3;
  uint32 vlan_id    = 4;  // 2000-2007
}

message AtmLinkOp {
  uint32 vlan_id = 1;
  uint32 cmd     = 2;
}

message PtmLinkOp {
  uint32 vlan_id = 1;
  uint32 cmd     = 2;
}

message LineOp {}

message ConfigResponse {
  bool   ok      = 1;
  string error   = 2;
  uint32 vlan_id = 3;
}
