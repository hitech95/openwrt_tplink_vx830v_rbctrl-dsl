// xDSL line configuration and admin control.
//
// Replaces OEM opcodes 1 (DSL config) and 3 (line close).
//
// ─── Why the ops are split ─────────────────────────────────────────────
// In the OEM protocol, opcode 1 doubles as the ONLY way to open the line
// (its apply path ends in `wan adsl open`), but the board silently
// deduplicates an op1 identical to its config cache — status 0, no side
// effects, NO open — and the cache cannot be read back. The host had to
// send two op1s differing in one bit to guarantee an open ("guaranteed
// double apply"). This protocol splits the concerns:
//
//   • line_config — params only (modulation, tones, annex); NEVER opens.
//     Reports cache hits (applied=false); a closed line is an error —
//     opening is line_open's job, never an implicit side effect.
//   • line_open   — apply config AND ensure the line is open (the agent
//     evaluates the full apply path, bypassing the dedup short-circuit).
//     One idempotent message replacing the double-apply trick; the
//     response reports what actually happened.
//   • line_close  — direct op3 replacement (administratively down; the
//     status poll reports LinkState.CLOSED).
//   • line_retrain — atomic agent-side close + open with current params.
//
// Data links are configured separately AFTER the line params (see
// links.proto) and read back together with them via get_config.

syntax = "proto3";

package rbctl;

import "common.proto";
import "links.proto";

message ConfigRequest {
  oneof action {
    LineConfig line_config  = 1;  // params only; never opens
    LineOpen   line_open    = 2;  // apply config + ensure open
    LineOp     line_close   = 3;  // administratively down (op3)
    LineOp     line_retrain = 4;  // atomic close + open, current params
  }
}

message LineConfig {
  ModulationType modulation            = 1;
  AnnexType      annex                 = 2;
  bool           bitswap               = 3;
  bool           sra                   = 4;
  uint32         vdsl2_profile         = 5;
  int32          snrm_offset_db_tenths = 6;
  uint32         max_ds_rate_kbps      = 10;
  uint32         max_us_rate_kbps      = 11;
  uint32         vectoring_mode        = 20;
}

// Open the line if not already open, applying `config` first (the
// replacement for the OEM double-apply trick: one idempotent message).
message LineOpen {
  LineConfig config = 1;
}

// No parameters: close acts on the active config; retrain restarts
// training with the current params. To retrain AND change params, send
// line_open with the new config (an open line re-trains on apply).
message LineOp {}

message ConfigResponse {
  bool applied = 10;  // params written; false = identical to cache (hit)
  bool opened  = 11;  // this call opened the line; false = already open
}

// ─── Current config readback (the op1 cache made readable) ─────────────
// The OEM config cache is write-only; nothing can read back which config
// is active or which data links were requested. This query closes both
// gaps in one message.

message GetConfigRequest {}

message ConfigDataResponse {
  LineConfig       config = 1;  // the params the line trains with
  repeated LinkEntry links = 2; // requested data links (order preserved)
}

// One requested data link. queued=true: requested but deferred until the
// line trains (not yet materialized); false: active on the board. The
// flag is authoritative — "line is up" alone only approximates it, since
// materialization completes shortly after the showtime transition
// (announced by LinkActiveEvent).
message LinkEntry {
  uint32 vlan_id = 1;  // assigned transport VLAN (the link ID)
  oneof kind {
    AtmLinkParams atm = 2;
    PtmLinkParams ptm = 3;
  }
  bool queued = 4;
}
