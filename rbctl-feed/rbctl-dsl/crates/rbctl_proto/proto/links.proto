// Data-link management — ATM/PTM links over the DSL channel.
//
// Replaces OEM opcodes 5/6 (ATM link add/del) and 15/16 (PTM link add/del),
// lifted out of the line-config request: data links have their own lifecycle
// (created around showtime, keyed by VLAN) and their own error surface.
//
// ─── Slots and identity ────────────────────────────────────────────────
// A data link occupies one of 8 board slots, indexed 0–7. The slot IS the
// link identity: transport VLAN = 2000 + slot, so `vlan_id` 2000–2007 in
// the messages below is just the slot spelled out. The agent derives the
// host-side interface name from it (lan0.<vlan>). Slots are stable across
// reboots/retrains — re-pointing a netifd interface at another link means
// re-creating it on a different slot.
//
// Board limits (session-4/5 RE, see docs/xdsl/data_plane.md quirks):
//   - max 8 links (slot exhaustion → error "link_table_full:");
//   - the board dedups on the SERVICE vid: duplicate service vids are
//     rejected ("link_exists:"), and untagged is vid −1, so at most ONE
//     untagged PTM link can ever exist.
//
// ─── Queueing semantics (matches the current OEM agent) ────────────────
// link_create received before the line is in showtime is QUEUED by the
// agent and materialized automatically when the line trains — exactly what
// the OEM board does with its provisioning commands (the board's status
// thread materializes queued link ops at showtime). The response reports
// queued=true so the host knows the link is deferred, not active.
// link_remove of a queued-but-not-materialized link simply dequeues it.
// Materialization is announced asynchronously via LinkActiveEvent
// (events.proto) — the hook for host-side data-plane notifications.

syntax = "proto3";

package rbctl;

// Service-VLAN handling of the bearer — mirrors the board's smux
// vlan_mode values 1/2/3 exactly (session-4 verdict, on-target):
//
//   mode 1 UNTAGGED    — strip any 802.1Q tag on TX. The session-4 field
//                        failure: a host-added service tag dies at the
//                        board and the BRAS sees untagged traffic.
//   mode 2 TRANSPARENT — VLAN-aware passthrough: tags traverse the board
//                        untouched, so a host-side QinQ stack (e.g.
//                        [transport 2000][service 100]) works end-to-end.
//                        UNREACHABLE via the OEM op15 encoding (it can
//                        only express modes 1 and 3) — first-class here.
//   mode 3 TAGGED      — insert/rewrite the TCI to (tag_vid, tag_pri) on
//                        TX and restore on RX: the board itself applies
//                        the service VLAN (the verified PPPoE fix).
enum VlanMode {
  VLAN_MODE_UNSPECIFIED = 0;  // absent → agent default (UNTAGGED)
  VLAN_MODE_UNTAGGED    = 1;  // smux mode 1
  VLAN_MODE_TRANSPARENT = 2;  // smux mode 2 — QinQ possible
  VLAN_MODE_TAGGED      = 3;  // smux mode 3
}

message LinkRequest {
  oneof action {
    LinkCreate create = 1;
    LinkRemove remove = 2;
  }
}

// Create a data link. `vlan_id` is the desired transport VLAN
// (2000–2007 = slot index + 2000); the response echoes the
// board-assigned one.
message LinkCreate {
  uint32 vlan_id = 1;  // 2000-2007 (slot 0-7 + 2000)
  oneof kind {
    AtmLinkParams atm = 2;
    PtmLinkParams ptm = 3;
  }
}

// Altering a link is deliberately not modeled: remove + re-create (the
// OEM ops are add/delete only too). If a real alter use case appears
// (e.g. ATM QoS change), it can be added as a new oneof arm later —
// proto3 additions are wire-compatible.

message LinkRemove {
  uint32 vlan_id = 1;  // link ID = assigned VLAN = 2000 + slot
}

message AtmLinkParams {
  uint32 vpi       = 1;
  uint32 vci       = 2;
  uint32 encap     = 3;  // 0=LLC, 1=VCMUX
  uint32 link_type = 4;  // 0=EoA, 6=PPPoA, 7=IPoA
  uint32 qos       = 5;  // 0=UBR, 1=CBR, 2=VBR
  uint32 pcr       = 6;
  uint32 scr       = 7;
  uint32 mbs       = 8;
}

// PTM bearer VLAN awareness. `vlan_mode` selects the smux behavior;
// default (UNSPECIFIED) resolves agent-side to UNTAGGED — an explicit
// mode is always recommended.
message PtmLinkParams {
  uint32  tag_vid   = 1;  // service vid 1-4094 (TAGGED mode only)
  uint32  tag_pri   = 2;  // 802.1p 0-7 (TAGGED mode only)
  VlanMode vlan_mode = 3;
}

message LinkResponse {
  uint32 vlan_id = 1;  // assigned (create) / removed VLAN (= 2000 + slot)
  bool   queued  = 2;  // true: deferred until showtime (not yet materialized)
}
