// xDSL line status (basic) — the daemon's poll request.
//
// Replaces OEM opcode 2 for control purposes: just enough for the daemon's
// state machine (up/down/closed, trained modulation for link-type
// derivation) at minimal agent cost — one cheap /proc read, ~30 bytes on
// the wire, never fragmented.
//
// The full statistics (SNR, power, errors, per-channel counters) live in
// xdsl_metrics.proto (line_metrics) — a strict superset fetched on demand
// by ubus/IPC consumers. Splitting keeps the 1 Hz poll cheap on the MIPS
// agent and the daemon's transition logic independent of bulk data.

syntax = "proto3";

package rbctl;

import "common.proto";

message GetLineStatusRequest {}

message LineStatusResponse {
  LinkState      link_state  = 1;  // incl. CLOSED = administratively down
  ModulationType modulation  = 2;  // trained modulation (link-type authority)
  DataPath       data_path   = 3;  // ATM/PTM as reported by the driver
  AnnexType      annex       = 4;
  uint32         uptime_secs = 5;  // current showtime session
}
