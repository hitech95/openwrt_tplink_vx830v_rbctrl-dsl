# cbindgen configuration for include/rbctl_voip.h (committed; regenerate with
#   cbindgen --config cbindgen.toml --output include/rbctl_voip.h
# from this directory). The ffi_header test fails if the file is stale.
language = "C"
header = """/* SPDX-License-Identifier: GPL-2.0-or-later */
/* Generated by cbindgen from crates/rbctl_voip_ffi/src/lib.rs. Do not edit. */"""
include_guard = "RBCTL_VOIP_H"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
style = "type"

[export]
include = ["rbctl_voip_media", "rbctl_voip_record"]

[enum]
prefix_with_name = true
