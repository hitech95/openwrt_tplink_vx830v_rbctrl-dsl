[package]
name = "fwextract"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-2.0-only"
description = "Extract and decrypt the remote-board (xDSL) firmware from a TP-Link multi-image container"

[features]
default = []
decrypt = ["dep:base64", "dep:num-bigint-dig", "dep:sha2", "dep:aes", "dep:cbc", "dep:cipher"]

[dependencies]
base64 = { version = "0.22", optional = true }
num-bigint-dig = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true, features = ["alloc"] }
cipher = { version = "0.4", optional = true, features = ["block-padding", "alloc"] }
